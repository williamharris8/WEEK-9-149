<!DOCTYPE html>
<html>
<head>
  <title>Sunnydale Feedback</title>
</head>
<body>
  <h1>Sunnydale Solutions Feedback</h1>
  
  <div id="welcome-box"></div>
  <div id="success-box"></div>
  <div id="error-box" style="color: red;"></div>

  <form id="feedback-form" novalidate>
    <p>Name: <input type="text" id="reviewer-name"></p>
    <p>Rating (1-5): <input type="number" id="rating" min="1" max="5"></p>
    <p>Comments:<br><textarea id="comments"></textarea></p>
    <button type="submit">Submit Feedback</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
